<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HIS 교사관리</title>
  <link rel="stylesheet" href="teacher-portal.css?v=r421" />
  <link rel="stylesheet" href="teacher-management.css?v=r421" />
</head>
<body>
  <header class="portal-header">
    <a class="portal-brand" href="index.html"><span class="portal-brand-mark">HIS</span><span><strong>교사관리</strong><small>Teacher Access Management</small></span></a>
    <div class="portal-header-actions">
      <a class="portal-btn" href="index.html">업무 메뉴</a>
      <a class="portal-btn" href="curriculum.html">커리큘럼 편집</a>
      <button id="portalLanguageBtn" class="portal-btn" type="button">English</button>
      <label class="portal-year-label">학년도 <select id="portalYearSelect" aria-label="학년도 선택"></select></label>
      <span id="portalAuthStatus" class="portal-auth-status">로그인 확인 중…</span>
      <button id="portalLoginBtn" class="portal-btn primary" type="button" hidden>Google 로그인</button>
      <button id="portalLogoutBtn" class="portal-btn" type="button" hidden>로그아웃</button>
    </div>
  </header>
  <main class="portal-shell teacher-admin-shell">
    <section id="portalLoading" class="portal-state-card"><div class="portal-spinner"></div><h2>관리자 권한을 확인하고 있습니다</h2></section>
    <section id="portalSignedOut" class="portal-state-card" hidden><div class="portal-state-icon">🔐</div><h2>관리자 계정으로 로그인해 주세요</h2><button id="portalLoginMainBtn" class="portal-btn primary large" type="button">Google 로그인</button></section>
    <section id="portalDenied" class="portal-state-card denied" hidden><div class="portal-state-icon">⛔</div><h2>관리자 권한이 없습니다</h2><p id="portalDeniedMessage"></p></section>
    <section id="teacherAdminApp" hidden>
      <div class="teacher-admin-heading"><div><p class="portal-kicker">ACCESS CONTROL</p><h1>교사관리</h1><p>교사 계정과 포털 접근 권한을 학년도별로 관리합니다.</p></div><div class="teacher-admin-actions"><button id="addTeacherBtn" class="portal-btn" type="button">+ 교사 등록</button><button id="saveTeachersBtn" class="portal-btn primary" type="button">변경사항 저장</button></div></div>
      <div class="role-guide"><span><strong>기본</strong> 교사용 페이지</span><span><strong>커리큘럼</strong> 기본 + 커리큘럼·시간표 편집</span><span><strong>관리자</strong> 전체 기능 + 교사관리</span></div>
      <div class="fixed-admin-note"><strong>고정 관리자</strong> jinwoosuk@his.sc.kr · 모든 학년도 관리자 권한</div>
      <div id="teacherAdminStatus" class="teacher-admin-status"></div>
      <div class="teacher-admin-table-wrap"><table class="teacher-admin-table"><thead><tr><th>이름</th><th>이메일</th><th>메모</th><th>접근 권한</th><th>상태</th><th></th></tr></thead><tbody id="teacherAdminRows"></tbody></table></div>
    </section>
  </main>
  <script type="module" src="./js/teacher-management.js?v=r421"></script>
</body>
</html>
