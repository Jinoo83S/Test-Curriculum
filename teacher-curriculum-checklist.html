<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HIS 담당 과목 확인</title>
  <link rel="stylesheet" href="teacher-portal.css?v=r417" />
</head>
<body data-portal-page="curriculum-checklist">
  <header class="portal-header">
    <a class="portal-brand" href="index.html">
      <span class="portal-brand-mark">HIS</span>
      <span><strong>담당 과목 확인</strong><small>교직원 업무 메뉴</small></span>
    </a>
    <div class="portal-header-actions">
      <a class="portal-btn" href="index.html">업무 메뉴</a>
      <label class="portal-year-label">학년도
        <select id="portalYearSelect" aria-label="학년도 선택"></select>
      </label>
      <span id="portalAuthStatus" class="portal-auth-status">로그인 확인 중…</span>
      <button id="portalLoginBtn" class="portal-btn primary" type="button" hidden>Google 로그인</button>
      <button id="portalLogoutBtn" class="portal-btn" type="button" hidden>로그아웃</button>
    </div>
  </header>

  <main class="portal-shell checklist-shell">
    <section id="portalLoading" class="portal-state-card">
      <div class="portal-spinner" aria-hidden="true"></div>
      <h2>담당 과목을 불러오고 있습니다</h2>
      <p>교사목록과 커리큘럼의 담당 교사를 확인합니다.</p>
    </section>
    <section id="portalSignedOut" class="portal-state-card" hidden>
      <div class="portal-state-icon">🔐</div>
      <h2>학교 Google 계정으로 로그인해 주세요</h2>
      <p>교사목록에 등록된 <strong>@his.sc.kr</strong> 계정만 이용할 수 있습니다.</p>
      <button id="portalLoginMainBtn" class="portal-btn primary large" type="button">Google 로그인</button>
    </section>
    <section id="portalDenied" class="portal-state-card denied" hidden>
      <div class="portal-state-icon">⛔</div>
      <h2>접근 권한이 없습니다</h2>
      <p id="portalDeniedMessage"></p>
    </section>

    <section id="checklistApp" hidden>
      <div class="checklist-heading">
        <div>
          <p class="portal-kicker"><span id="checklistYear"></span> CURRICULUM DOCUMENTS</p>
          <h1><span id="checklistTeacherName"></span> 선생님 담당 과목</h1>
          <p>각 과목의 폴더 링크와 교과계획서 필수 항목을 확인한 뒤 ‘최종 확인’을 체크하세요.</p>
        </div>
        <div class="checklist-summary">
          <strong id="checklistProgress">0 / 0</strong>
          <span>최종 확인 완료</span>
          <div class="checklist-progress-track"><i id="checklistProgressBar"></i></div>
        </div>
      </div>

      <div class="semester-tabs" role="tablist" aria-label="학기 선택">
        <button class="semester-tab active" data-semester="sem1" type="button" role="tab">1학기</button>
        <button class="semester-tab" data-semester="sem2" type="button" role="tab">2학기</button>
        <span id="checklistSaveStatus" class="checklist-save-status">저장 준비</span>
      </div>
      <div id="checklistCourses" class="checklist-course-list"></div>
    </section>
  </main>
  <script type="module" src="./js/teacher-portal.js?v=r417"></script>
</body>
</html>
