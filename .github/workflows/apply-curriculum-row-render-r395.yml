name: Apply curriculum row render r395

on:
  push:
    branches: [feature/curriculum-row-render-r395]
    paths:
      - ".github/workflows/apply-curriculum-row-render-r395.yml"
      - ".patches/apply-curriculum-row-render-r395.py"
  pull_request:
    branches: [main]
    paths:
      - "js/curriculum.js"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/curriculum-row-render-r395
          fetch-depth: 0
          show-progress: false

      - name: Apply minimal patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .patches/apply-curriculum-row-render-r395.py
          git diff --check

      - name: Static regression checks
        shell: bash
        run: |
          set -euo pipefail
          node --check js/curriculum.js
          python3 - <<'PY'
          from pathlib import Path
          text = Path('js/curriculum.js').read_text(encoding='utf-8')
          add_start = text.index('export function addRow(grade)')
          add_end = text.index('/** 이전 버전 호환용', add_start)
          delete_start = text.index('export function deleteRow(grade, rowId)')
          delete_end = text.index('// ── Options Mutations', delete_start)
          add_block = text[add_start:add_end]
          delete_block = text[delete_start:delete_end]
          assert 'curriculum().gradeBoards[grade] = rows;' in add_block
          assert '_onCurriculumChange();' in add_block
          assert '_onCurriculumChange();' in delete_block
          assert add_block.count('scheduleSave("curriculum")') == 1
          assert delete_block.count('scheduleSave("curriculum")') == 1
          print('CURRICULUM_ROW_RENDER_R395_CHECK_OK')
          PY
          changed="$(git diff --name-only | sort)"
          expected="js/curriculum.js"
          test "$changed" = "$expected"
          git diff --stat
          git diff --numstat

      - name: Build vscode upload ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/upload/js
          cp js/curriculum.js /tmp/upload/js/
          cat > /tmp/upload/업로드_안내.txt <<'EOF'
          r395 · 커리큘럼 메인 화면 행 추가/삭제 즉시 갱신

          변경 파일: js/curriculum.js 1개
          수정 내용:
          - addRow() 후 _onCurriculumChange() 호출
          - deleteRow() 후 _onCurriculumChange() 호출
          - addRow()에서 gradeBoards[grade] 참조를 명시 재할당

          유지:
          - 저장 로직 scheduleSave("curriculum") 유지
          - 커리큘럼 계산/과목카드/시간표/Firestore 구조 변경 없음
          - CSS 변경 없음

          커밋명: 커리큘럼_행추가삭제_즉시갱신_r395
          EOF
          cd /tmp/upload
          zip -r /tmp/커리큘럼_행추가삭제_즉시갱신_r395_vscode업로드용.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: curriculum-row-render-r395-vscode-upload
          path: /tmp/커리큘럼_행추가삭제_즉시갱신_r395_vscode업로드용.zip
          if-no-files-found: error
          retention-days: 14

      - name: Commit operational files only
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .patches
          rm -f .github/workflows/apply-curriculum-row-render-r395.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "커리큘럼_행추가삭제_즉시갱신_r395"
          git push origin HEAD:feature/curriculum-row-render-r395
