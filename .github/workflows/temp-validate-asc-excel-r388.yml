name: Temporary validate aSc Excel r388

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/asc-excel-import-r388
          fetch-depth: 0
          show-progress: false

      - name: Extract, apply and validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('.github/workflows/apply-asc-excel-import-r388.yml').read_text(encoding='utf-8')
          for name in ('module.gz.b64', 'patch.gz.b64'):
              m = re.search(rf"cat > /tmp/{re.escape(name)} <<'EOF'\n(.*?)\nEOF", text, re.S)
              if not m: raise SystemExit(f'payload not found: {name}')
              Path('/tmp/' + name).write_text(m.group(1) + '\n', encoding='utf-8')
          PY
          base64 -d /tmp/module.gz.b64 | gzip -dc > js/timetable-excel-import.js
          base64 -d /tmp/patch.gz.b64 | gzip -dc > /tmp/asc-excel-import-r388.patch
          test "$(sha256sum /tmp/asc-excel-import-r388.patch | awk '{print $1}')" = "1da979a126a46d243356010fe13788444547100b66607fb209156ca581203803"
          git apply --recount --check /tmp/asc-excel-import-r388.patch
          git apply --recount --whitespace=nowarn /tmp/asc-excel-import-r388.patch
          node --check js/timetable-excel-import.js
          node --check js/timetable.js
          git diff --check
          actual="$( { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u | tr '\n' ' ')"
          test "$actual" = "js/timetable-excel-import.js js/timetable.js timetable.html "
          ! printf '%s\n' "$actual" | grep -E '\.css$'
          grep -q 'data-action="import-xlsx"' js/timetable.js
          grep -q 'timetableModuleVersion = "2026-08-10-asc-excel-import-r388"' timetable.html
          cp js/timetable-excel-import.js /tmp/timetable-excel-import.mjs
          node --input-type=module <<'NODE'
          import { buildTimetableExcelImportPlan } from 'file:///tmp/timetable-excel-import.mjs';
          const classes=[{grade:'10학년',name:'A'},{grade:'11학년',name:'A'}];
          const classKey=i=>`${String(i.gradeKey||i.grade).match(/\d+/)?.[0]}:${String(i.section||i.name).toUpperCase()}`;
          const cards=[{id:'c1',templateId:'t1',gradeKey:'10학년',subject:'세계시민과 지리',track:'배정2',teachers:['김진'],classKeys:['10:A']},{id:'c2',templateId:'t2',gradeKey:'11학년',subject:'세계 문화와 영어',track:'선택3',teachers:['Cristina'],classKeys:['11:A']}];
          const rows=[{'학년':'10','반':'10A','요일':'월요일','교시':'2','과목':'10.2-사회영어','교사':'김진','교실':'Chapel'},{'학년':'11','반':'11A','요일':'화요일','교시':'8','과목':'11.3-영어','교사':'Cristina','교실':'MH301'}];
          const infos=c=>c.classKeys.map(k=>{const[g,s]=k.split(':');return{gradeKey:g+'학년',section:s}});
          const plan=buildTimetableExcelImportPlan(rows,{periodCount:7,classes,rooms:[{id:'r1',name:'TH201'},{id:'r2',name:'MH301'}],teachers:[{id:'x1',name:'김진'},{id:'x2',name:'Cristina'}],cards,groups:[],classKey,getTemplateById:()=>null,getTtCardClassInfos:infos,getTeachersForTtCard:c=>c.teachers,buildEntryDataFromTtCards:(cs,o)=>({day:o.day,period:o.period,ttcardId:cs[0].id,ttcardIds:[cs[0].id],templateId:cs[0].templateId,gradeKey:cs[0].gradeKey}),normalizeTimetableEntry:x=>x,uid:p=>p+'-1'},{});
          if (!plan.ready || plan.periodOffset !== 2 || plan.entries[0].period !== 0 || plan.entries[1].period !== 6 || plan.entries[0].roomId !== 'r1' || plan.entries[0].ttcardId !== 'c1' || plan.entries[1].ttcardId !== 'c2') throw new Error('core import test failed');
          console.log('ASC_EXCEL_IMPORT_R388_CORE_OK');
          NODE

      - name: Build upload ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/upload/js
          cp timetable.html /tmp/upload/
          cp js/timetable.js js/timetable-excel-import.js /tmp/upload/js/
          cd /tmp/upload
          zip -r /tmp/커리큘럼_aSc_Excel_시간표가져오기_r388_vscode업로드용.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: asc-excel-import-r388-vscode-upload
          path: /tmp/커리큘럼_aSc_Excel_시간표가져오기_r388_vscode업로드용.zip
          if-no-files-found: error
          retention-days: 14

      - name: Commit operational files only
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-asc-excel-import-r388.yml .asc-excel-import-r388-trigger
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "시간표_aSc_Excel_가져오기_미리보기_자동백업_r388"
          git push origin HEAD:feature/asc-excel-import-r388
