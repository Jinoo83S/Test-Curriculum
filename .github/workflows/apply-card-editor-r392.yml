name: Apply timetable card editor r392

on:
  push:
    branches: [feature/timetable-card-editor-r392]
    paths:
      - ".github/workflows/apply-card-editor-r392.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/apply-card-editor-r392.yml"
      - ".patches/timetable-card-editor-r392.patch"
      - "js/timetable-card-editor.js"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/timetable-card-editor-r392
          fetch-depth: 0
          show-progress: false

      - name: Verify base and apply patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD main)" = "81a16ac0efc3d1efd2259fdc4b2c4333247e572f"
          git apply --check .patches/timetable-card-editor-r392.patch
          git apply --whitespace=nowarn .patches/timetable-card-editor-r392.patch
          git diff --check

      - name: Static regression checks
        shell: bash
        run: |
          set -euo pipefail
          node --check js/timetable-card-editor.js
          node --check js/timetable.js
          test "$(grep -c 'id="ttCardEditorBtn"' timetable.html)" = "1"
          grep -q '2026-08-12-timetable-card-editor-r392' timetable.html
          grep -q 'createTimetableCardEditor' js/timetable.js
          grep -q 'card.autoAssignExcluded === true' js/timetable.js
          grep -q 'teacherEventsManagerApi' js/timetable.js
          grep -q 'createTimetableExcelImport' js/timetable.js
          grep -q 'saveNow("timetable", { force: true })' js/timetable.js
          ! git diff --name-only | grep -E '\.css$'
          changed="$( { git diff --name-only; git ls-files --others --exclude-standard; } | grep -v '^\.patches/' | grep -v '^\.github/workflows/' | sort -u )"
          expected=$(printf '%s\n' js/timetable-card-editor.js js/timetable.js timetable.html | sort)
          test "$changed" = "$expected"
          html_stats=$(git diff --numstat -- timetable.html)
          test "$(echo "$html_stats" | awk '{print $1}')" -le 5
          test "$(echo "$html_stats" | awk '{print $2}')" -le 4
          echo CARD_EDITOR_R392_CHECK_OK
          git diff --stat
          git diff --numstat

      - name: Build vscode upload ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/upload/js
          cp timetable.html /tmp/upload/
          cp js/timetable.js js/timetable-card-editor.js /tmp/upload/js/
          cat > /tmp/upload/업로드_안내.txt <<'EOF'
          기준 커밋: 81a16ac0efc3d1efd2259fdc4b2c4333247e572f
          운영 파일: 3개
          CSS 변경: 없음
          커밋명: 시간표_카드상세편집_교사반시수교실시간조건_r392
          EOF
          cd /tmp/upload
          zip -r /tmp/커리큘럼_시간표카드_상세편집_r392_vscode업로드용.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: timetable-card-editor-r392-vscode-upload
          path: /tmp/커리큘럼_시간표카드_상세편집_r392_vscode업로드용.zip
          if-no-files-found: error
          retention-days: 14

      - name: Commit operational files only
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .patches/timetable-card-editor-r392.patch
          rm -f .github/workflows/apply-card-editor-r392.yml
          rmdir .patches 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "시간표_카드상세편집_교사반시수교실시간조건_r392"
          git push origin HEAD:feature/timetable-card-editor-r392
