name: Apply timetable manual card r394

on:
  push:
    branches: [feature/timetable-manual-card-r394]
    paths:
      - ".github/workflows/apply-manual-card-r394.yml"
      - ".patches/apply-manual-card-r394.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/apply-manual-card-r394.yml"
      - ".patches/apply-manual-card-r394.py"
      - "js/timetable-card-editor.js"
      - "js/timetable.js"
      - "timetable.html"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/timetable-manual-card-r394
          fetch-depth: 0
          show-progress: false

      - name: Verify base and apply changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD a1bf0250119320dac9d9b38c104dbc86cf6ae799)" = "a1bf0250119320dac9d9b38c104dbc86cf6ae799"
          python3 .patches/apply-manual-card-r394.py
          git diff --check

      - name: Static regression checks
        shell: bash
        run: |
          set -euo pipefail
          node --check js/timetable-card-editor.js
          node --check js/timetable.js
          node --check js/timetable-detail.js
          node --check js/ttcards.js
          grep -q 'cloneTimetableCardForManualUse' js/timetable.js
          grep -q 'deleteManualTimetableCard' js/timetable.js
          grep -q 'manualCardStatus = "stored"' js/timetable.js
          grep -q 'autoAssignExcluded = true' js/timetable.js
          grep -q '＋ 이 카드 복제' js/timetable-card-editor.js
          grep -q '수동카드 삭제' js/timetable-card-editor.js
          grep -q 'data-field="subject"' js/timetable-card-editor.js
          grep -q 'applyTimetableCardOccurrenceRooms' js/timetable.js
          grep -q 'createTimetableExcelImport' js/timetable.js
          grep -q 'teacherEventsManagerApi' js/timetable.js
          grep -q 'mergeGeneratedAndManualCards' js/ttcards.js
          test "$(grep -c 'id=\"ttCardEditorBtn\"' timetable.html || true)" = "0"
          grep -q '2026-08-12-manual-card-clone-delete-r394' timetable.html
          changed="$(git diff --name-only | sort)"
          expected=$(printf '%s\n' js/timetable-card-editor.js js/timetable.js timetable.html | sort)
          test "$changed" = "$expected"
          ! printf '%s\n' "$changed" | grep -E '\.css$'
          echo MANUAL_CARD_R394_CHECK_OK
          git diff --stat
          git diff --numstat

      - name: Build vscode upload ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/upload/js
          cp timetable.html /tmp/upload/
          cp js/timetable.js js/timetable-card-editor.js /tmp/upload/js/
          cat > /tmp/upload/업로드_안내.txt <<'EOF'
          기준 커밋: a1bf0250119320dac9d9b38c104dbc86cf6ae799 (r393)
          운영 변경 파일: 3개
          CSS 변경: 없음
          기능:
          - 카드 상세에서 현재 카드 복제
          - 복제본은 독립 수동카드 + 자동배치 제외 상태로 생성
          - 수동카드 과목명/영문명 수정
          - 미배치·미그룹 수동카드만 안전 삭제
          - 기존 r393 회차별 교실/카드 편집 유지
          커밋명: 시간표_카드상세_수동카드복제추가삭제_r394
          EOF
          cd /tmp/upload
          zip -r /tmp/커리큘럼_카드상세_수동카드복제추가삭제_r394_vscode업로드용.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: timetable-manual-card-r394-vscode-upload
          path: /tmp/커리큘럼_카드상세_수동카드복제추가삭제_r394_vscode업로드용.zip
          if-no-files-found: error
          retention-days: 14

      - name: Commit operational files only
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .patches
          rm -f .github/workflows/apply-manual-card-r394.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "시간표_카드상세_수동카드복제추가삭제_r394"
          git push origin HEAD:feature/timetable-manual-card-r394
