name: Apply curriculum row render r396

on:
  push:
    branches: [feature/curriculum-row-render-r396]
    paths:
      - ".github/workflows/apply-curriculum-row-render-r396.yml"
      - ".patches/apply-curriculum-row-render-r396.py"
  pull_request:
    branches: [main]
    paths:
      - "js/curriculum.js"
      - ".github/workflows/apply-curriculum-row-render-r396.yml"
      - ".patches/apply-curriculum-row-render-r396.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/curriculum-row-render-r396
          fetch-depth: 0
          show-progress: false

      - name: Apply r396 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .patches/apply-curriculum-row-render-r396.py
          git diff --check

      - name: Static regression checks
        shell: bash
        run: |
          set -euo pipefail
          node --check js/curriculum.js
          grep -q 'function createGradeRow(grade, rowData, onUpdate)' js/curriculum.js
          grep -q 'deleteRow(grade, rowData.id); if (typeof onUpdate === "function") onUpdate();' js/curriculum.js
          grep -q 'addRow(grade); if (typeof onUpdate === "function") onUpdate();' js/curriculum.js
          grep -q 'createGradeRow(g, rd, onUpdate)' js/curriculum.js
          grep -q '_onCurriculumChange();' js/curriculum.js
          changed="$(git diff --name-only | sort)"
          expected='js/curriculum.js'
          test "$changed" = "$expected"
          echo CURRICULUM_ROW_RENDER_R396_CHECK_OK
          git diff --stat
          git diff --numstat

      - name: Build vscode upload ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/upload/js
          cp js/curriculum.js /tmp/upload/js/
          cat > /tmp/upload/검증결과.txt <<'EOF'
          r396 검증 결과
          - 기준: r395 행추가삭제 즉시갱신 패치 위에 보드 직접 갱신 연결
          - 변경 파일: js/curriculum.js 1개
          - node --check js/curriculum.js 통과
          - 행 추가 버튼: addRow 후 onUpdate 호출
          - 행 삭제 버튼: deleteRow 후 onUpdate 호출
          - createGradeRow 호출부: onUpdate 전달
          - 기존 저장/계산/과목카드 로직 변경 없음
          커밋명: 커리큘럼_행추가삭제_보드직접갱신_r396
          EOF
          cd /tmp/upload
          zip -r /tmp/커리큘럼_행추가삭제_보드직접갱신_r396_vscode업로드용.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: curriculum-row-render-r396-vscode-upload
          path: /tmp/커리큘럼_행추가삭제_보드직접갱신_r396_vscode업로드용.zip
          if-no-files-found: error
          retention-days: 14

      - name: Commit operational file only
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .patches
          rm -f .github/workflows/apply-curriculum-row-render-r396.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "커리큘럼_행추가삭제_보드직접갱신_r396"
          git push origin HEAD:feature/curriculum-row-render-r396
