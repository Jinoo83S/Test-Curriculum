name: Apply aSc Excel import r388

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/asc-excel-import-r388
          fetch-depth: 0
          show-progress: false

      - name: Rebuild source and patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/module.gz.b64 <<'EOF'

EOF
          cat > /tmp/patch.gz.b64 <<'EOF'

EOF
          base64 -d /tmp/module.gz.b64 | gzip -dc > /tmp/timetable-excel-import.js
          base64 -d /tmp/patch.gz.b64 | gzip -dc > /tmp/asc-excel-import-r388.patch
          test "$(sha256sum /tmp/asc-excel-import-r388.patch | awk '{print $1}')" = "1da979a126a46d243356010fe13788444547100b66607fb209156ca581203803"
          test "$(wc -l < /tmp/timetable-excel-import.js | tr -d ' ')" = "651"
          git apply --recount --check /tmp/asc-excel-import-r388.patch

      - name: Apply and validate
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/timetable-excel-import.js js/timetable-excel-import.js
          git apply --recount --whitespace=nowarn /tmp/asc-excel-import-r388.patch
          node --check js/timetable-excel-import.js
          node --check js/timetable.js
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "js/timetable-excel-import.js js/timetable.js timetable.html "
          ! git diff --name-only | grep -E '\.css$'
          grep -q 'data-action="import-xlsx"' js/timetable.js
          grep -q 'timetableModuleVersion = "2026-08-10-asc-excel-import-r388"' timetable.html
          grep -q 'import(versioned("./timetable-excel-import.js"))' js/timetable.js

          cp js/timetable-excel-import.js /tmp/timetable-excel-import.mjs
          node --input-type=module <<'NODE'
          import { buildTimetableExcelImportPlan, normalizeAscExcelRows } from 'file:///tmp/timetable-excel-import.mjs';
          const classes=[{grade:'10학년',name:'A'},{grade:'11학년',name:'A'}];
          const classKey=i=>`${String(i.gradeKey||i.grade).match(/\d+/)?.[0]}:${String(i.section||i.name).toUpperCase()}`;
          const cards=[
            {id:'c1',templateId:'t1',gradeKey:'10학년',sectionIdx:0,subject:'세계시민과 지리',track:'배정2',teachers:['김진'],classKeys:['10:A']},
            {id:'c2',templateId:'t2',gradeKey:'11학년',sectionIdx:0,subject:'세계 문화와 영어',track:'선택3',teachers:['Cristina'],classKeys:['11:A']},
          ];
          const rows=[
            {'학년':'10','반':'10A','요일':'월요일','교시':'2','과목':'10.2-사회영어','교사':'김진','교실':'Chapel'},
            {'학년':'11','반':'11A','요일':'화요일','교시':'8','과목':'11.3-영어','교사':'Cristina','교실':'MH301'},
          ];
          const infos=c=>c.classKeys.map(k=>{const[g,s]=k.split(':');return{gradeKey:g+'학년',section:s}});
          const plan=buildTimetableExcelImportPlan(rows,{periodCount:7,classes,rooms:[{id:'r1',name:'TH201'},{id:'r2',name:'MH301'}],teachers:[{id:'x1',name:'김진'},{id:'x2',name:'Cristina'}],cards,groups:[],classKey,getTemplateById:()=>null,getTtCardClassInfos:infos,getTeachersForTtCard:c=>c.teachers,buildEntryDataFromTtCards:(cs,o)=>({day:o.day,period:o.period,ttcardId:cs[0].id,ttcardIds:[cs[0].id],templateId:cs[0].templateId,gradeKey:cs[0].gradeKey}),normalizeTimetableEntry:x=>x,uid:p=>p+'-1'},{});
          if (!plan.ready || plan.unresolved.length || plan.invalidRows.length) throw new Error('plan not ready');
          if (plan.periodOffset !== 2) throw new Error('aSc period offset failed');
          if (plan.entries[0].period !== 0 || plan.entries[1].period !== 6) throw new Error('period mapping failed');
          if (plan.entries[0].roomId !== 'r1') throw new Error('Chapel room alias failed');
          if (plan.entries[0].ttcardId !== 'c1' || plan.entries[1].ttcardId !== 'c2') throw new Error('subject/teacher matching failed');
          const normalized=normalizeAscExcelRows(rows,{periodCount:7,classMap:new Map([['10A',{key:'10:A'}],['11A',{key:'11:A'}]])});
          if (normalized.rows.length !== 2 || normalized.invalid.length) throw new Error('row normalization failed');
          console.log('ASC_EXCEL_IMPORT_R388_CORE_OK');
          NODE

      - name: Build upload ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/upload/js
          cp timetable.html /tmp/upload/
          cp js/timetable.js js/timetable-excel-import.js /tmp/upload/js/
          cd /tmp/upload
          zip -r /tmp/커리큘럼_aSc_Excel_시간표가져오기_r388_vscode업로드용.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: asc-excel-import-r388-vscode-upload
          path: /tmp/커리큘럼_aSc_Excel_시간표가져오기_r388_vscode업로드용.zip
          if-no-files-found: error
          retention-days: 14

      - name: Commit operational files only
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-asc-excel-import-r388.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "시간표_aSc_Excel_가져오기_미리보기_자동백업_r388"
          git push origin HEAD:feature/asc-excel-import-r388
